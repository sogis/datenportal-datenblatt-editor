name: Verify and publish Datenblatt MCP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: sogis/datenportal-datenblatt-mcp
  GHCR_IMAGE: ghcr.io/sogis/datenportal-datenblatt-mcp
  IMAGE_VERSION: 0.2.${{ github.run_number }}

jobs:
  application:
    name: Verify Java and editor interoperability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test both MCP transports and build the canonical JAR
        working-directory: mcp-java
        run: ./gradlew --no-daemon clean check bootJar
      - name: Check the real editor parser
        working-directory: mcp-java
        run: node scripts/check-editor.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-mcp-jar
          path: mcp-java/build/libs/datasheet-mcp.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mcp-test-reports
          path: mcp-java/build/reports/

  images:
    name: Verify ${{ matrix.architecture }} image
    needs: application
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: canonical-mcp-jar
          path: mcp-java/build/libs
      - uses: docker/setup-buildx-action@v4
      - name: Build using the tested JAR
        uses: docker/build-push-action@v7
        with:
          context: mcp-java
          file: mcp-java/Dockerfile
          target: canonical
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: datasheet-mcp-verified:ci
          build-args: |
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=datasheet-mcp-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=datasheet-mcp-${{ matrix.architecture }}
      - name: Verify HTTP, offline STDIO, copied models and exact JAR
        run: python3 mcp-java/scripts/check-image.py --image datasheet-mcp-verified:ci
      - name: Verify original attachments through Open WebUI
        if: matrix.architecture == 'amd64'
        run: python3 mcp-java/scripts/check-openwebui.py --image datasheet-mcp-verified:ci
      - name: Save the verified image without rebuilding
        run: docker save datasheet-mcp-verified:ci | gzip > verified-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-mcp-image-${{ matrix.architecture }}
          path: verified-image.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish verified multiarch images
    needs: images
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-mcp-image-*
          path: verified-images
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact verified images and inspect their manifests
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            docker load < "verified-images/verified-mcp-image-$architecture/verified-image.tar.gz"
            for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
              docker tag datasheet-mcp-verified:ci "$image:$IMAGE_VERSION-$architecture"
              docker push "$image:$IMAGE_VERSION-$architecture"
            done
          done
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker buildx imagetools create --tag "$image:$IMAGE_VERSION" "$image:$IMAGE_VERSION-amd64" "$image:$IMAGE_VERSION-arm64"
            docker buildx imagetools inspect --raw "$image:$IMAGE_VERSION" > manifest.json
            python3 mcp-java/scripts/verify-image-manifest.py manifest.json
            docker buildx imagetools create --tag "$image:sha-${GITHUB_SHA:0:7}" "$image:$IMAGE_VERSION"
            if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              docker buildx imagetools create --tag "$image:latest" "$image:$IMAGE_VERSION"
            fi
          done
