spring:
  profiles:
    default: stdio
  main:
    banner-mode: "off"
  application:
    name: datasheet-mcp
  ai:
    mcp:
      server:
        type: SYNC
        request-timeout: 1h
        name: Datenblatt MCP Kanton Solothurn
        version: 0.2.0
        instructions: ${datasheet.common-instructions} ${datasheet.transport-instructions}
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
  jackson:
    property-naming-strategy: SNAKE_CASE
logging:
  level:
    root: WARN

datasheet:
  common-instructions: >
    Read describe_schema before editing unfamiliar fields. Use draft_id and the
    latest revision returned by read_datasheet or a mutation. Supply expected_revision
    for mutations, validation and export. On conflict, read again and reconsider the change.
    Use internal attribute_id and issue_id for unambiguous updates.
    Never invent missing mandatory values or merge attributes by similar meaning.
    Omitted fields remain unchanged; null clears a field. Incomplete drafts are allowed.
    Validate before export; explain validation errors to the user.
    Drafts exist only until discarded or the server restarts.
